name: CI / CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out your code
      - uses: actions/checkout@v3

      # 2. Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      # 3. Cache Maven dependencies
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 4. Build and run tests
      - name: Build with Maven
        run: mvn --batch-mode verify

  docker-build-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3

      # 1. Log in to GHCR using PAT
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      # 2. Build the image
      - name: Build Docker image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/medical-register:${{ github.sha }}
          docker build -t $IMAGE .

      # 3. Push it to GHCR
      - name: Push image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/medical-register:${{ github.sha }}
          docker push $IMAGE

  deploy:
    needs: docker-build-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      # 1. Check out code again (optional but usually needed for k8s manifests)
      - uses: actions/checkout@v3

      # 2. Set up kubectl
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      # 3. Deploy to Kubernetes
      - name: Deploy to Kubernetes
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/medical-register:${{ github.sha }}
        run: |
          kubectl set image deployment/medical-register medical-register=$IMAGE --namespace production
          kubectl rollout status deployment/medical-register --namespace production
  