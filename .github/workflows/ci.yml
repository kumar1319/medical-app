name: CI / CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out your code
      - uses: actions/checkout@v3

      # 2. Set up JDK 17 (or whatever version you’re using)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      # 3. Cache Maven dependencies between runs
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 4. Build and run tests
      - name: Build with Maven
        run: mvn --batch-mode verify

  docker-build-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      # 1. Log in to DockerHub (store DOCKERHUB_USERNAME & DOCKERHUB_TOKEN as repo secrets)
      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 2. Build the image
      - name: Build Docker image
        run: |
          docker build \
            --file Dockerfile \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/medical-register:${{ github.sha }} \
            .

      # 3. Push it
      - name: Push image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/medical-register:${{ github.sha }}

  deploy:
    needs: docker-build-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      # This is an example for a Kubernetes cluster; adjust to your environment
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Deploy to Kubernetes
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/medical-register:${{ github.sha }}
        run: |
          kubectl set image deployment/medical-register medical-register=$IMAGE --namespace production
          kubectl rollout status deployment/medical-register --namespace production
